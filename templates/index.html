<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>八字命理分析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
header{padding:16px 20px;border-bottom:1px solid #21262d;text-align:center}
header span{font-size:13px;color:#8b949e}
.form-wrap{max-width:500px;margin:40px auto;padding:0 20px}
h1{text-align:center;font-size:24px;margin-bottom:8px;color:#f0f6fc}
.subtitle{text-align:center;font-size:13px;color:#8b949e;margin-bottom:32px}
.row{display:flex;gap:12px;margin-bottom:16px}
.row label{flex:1}
label{display:block;font-size:13px;color:#8b949e;margin-bottom:6px}
input,select{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#c9d1d9;font-size:15px;appearance:none}
input:focus,select:focus{outline:none;border-color:#58a6ff;box-shadow:0 0 0 3px rgba(88,166,255,.15)}
.btn{width:100%;padding:13px;border:none;border-radius:8px;background:#238636;color:#fff;font-size:16px;cursor:pointer;margin-top:8px}
.btn:hover{background:#2ea043}
.btn:active{background:#196c2e}
footer{text-align:center;padding:24px;font-size:12px;color:#484f58}
@media(max-width:480px){.row{flex-direction:column}}
</style>
</head>
<body>
<header><span>🔮 基于 china-testing/bazi 纯规则引擎 · 零 AI 依赖</span></header>
<div class="form-wrap">
  <h1>八字命理分析</h1>
  <p class="subtitle">输入出生信息，获取五行强弱·格局·用神·大运·调候·神煞·六亲·断语完整分析</p>
  <form action="/analyze" method="post">
    <div class="row">
      <label>年<input type="number" name="year" value="1979" min="1900" max="2100" required></label>
      <label>月<input type="number" name="month" value="7" min="1" max="12" required></label>
    </div>
    <div class="row">
      <label>日<input type="number" name="day" value="31" min="1" max="31" required></label>
      <label>时（0-23）<input type="number" name="hour" value="8" min="0" max="23" required></label>
    </div>
    <div class="row">
      <label>性别<select name="gender"><option value="male" selected>男</option><option value="female">女</option></select></label>
      <label>历法<select name="cal"><option value="gregorian" selected>公历</option><option value="lunar">农历</option></select></label>
    </div>
    <button class="btn" type="submit">开始分析</button>
  </form>
</div>
<footer>八字排盘引擎来自 <a href="https://github.com/china-testing/bazi" style="color:#58a6ff">china-testing/bazi</a> · 部署在 Railway.app</footer>
</body>
</html>
